name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest pytest-asyncio aiohttp voluptuous yarl ruff

      - name: Lint with Ruff
        run: ruff check custom_components tests

      - name: Run unit tests
        run: pytest -v
